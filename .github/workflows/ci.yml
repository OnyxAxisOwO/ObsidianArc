# The gate, run by something other than the person who wrote the change.
#
# The same checks as `make test-full` run in parallel, with Gate collecting
# their results so branch protection still requires every part.
#
# It also executes the two paths nothing had ever executed. The Postgres schema
# was covered by a lint and by a test that skipped itself without a database,
# and the Dockerfile had been written and reviewed but never built. Both run
# here, on every push, against the real thing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci --no-fund --no-audit
      - run: npm --prefix docs run build
      - run: npm --prefix docs test
      - run: git diff --exit-code

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc -d arc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Go embeds the frontend, so each isolated runner builds it first.
      - run: make web-ci
      - run: make test-go
        env:
          OBSIDIAN_TEST_POSTGRES_DSN: postgres://arc:arc@localhost:5432/arc_test?sslmode=disable
      - run: git diff --exit-code

  race:
    name: Plugin race tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc -d arc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Go embeds the frontend, so each isolated runner builds it first.
      - run: make web-ci
      - run: make test-race
        env:
          OBSIDIAN_TEST_POSTGRES_DSN: postgres://arc:arc@localhost:5432/arc_test?sslmode=disable

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-ci
      - run: make web-test typecheck
      - run: git diff --exit-code

  test:
    name: Gate
    if: always()
    needs: [go-test, race, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job
        env:
          GO_RESULT: ${{ needs.go-test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$GO_RESULT" = success && test "$RACE_RESULT" = success && test "$FRONTEND_RESULT" = success

  docker:
    name: Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t obsidian-arc:ci .

      # The other way to the same image: compiled outside it, the way
      # `make deploy` does on a developer's machine, and wrapped by
      # Dockerfile.release. Built here so that file cannot drift from the
      # final stage of the one above without something starting to fail.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the release image from a binary compiled outside it
        run: |
          make web-ci package
          docker build -t obsidian-arc:release dist

      # Reviewed but never run, until now. A distroless image with no shell
      # cannot be inspected from inside, so the check is the one thing that
      # matters: it starts, it migrates, and it answers.
      - name: Both start, migrate and serve
        run: |
          serve() {
            docker run -d --name "arc-$1" -p "$2:8080" \
              -e OBSIDIAN_SECRET_KEY=$(openssl rand -hex 32) \
              "obsidian-arc:$1"
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$2/api/health"; then
                echo
                echo "obsidian-arc:$1 served after ${attempt}s"
                return 0
              fi
              sleep 1
            done
            echo "obsidian-arc:$1 never answered; container log follows"
            docker logs "arc-$1"
            return 1
          }
          serve ci 8080
          serve release 8081

      - name: Stop them
        if: always()
        run: docker rm -f arc-ci arc-release || true
