name: GHCR cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Manual cleanup must not race a release while its image index is being built.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ghcr-cleanup.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
