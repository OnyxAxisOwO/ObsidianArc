name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

# Read-only for every job. The Pages deployment and its OIDC token are granted
# to the deploy job alone, so nothing that runs while the site is built (the
# docs' own dependencies included) holds a token that can publish it.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # The token is not left in .git/config, where a dependency's install
      # script could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # --ignore-scripts: the build needs no dependency's install script (esbuild
      # runs from its optional platform package), and a script that ran here
      # could alter the site this job uploads, whatever token it held.
      - run: npm --prefix docs ci --ignore-scripts --no-fund --no-audit
      - run: npm --prefix docs run build
        env:
          DOCS_BASE: /ObsidianArc/
      - run: npm --prefix docs test
        env:
          DOCS_BASE: /ObsidianArc/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
