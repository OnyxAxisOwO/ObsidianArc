<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Arc</title>
<meta name="description" content="A standalone, bring-your-own-key AI chat workspace. No account, no server, no build step.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236c4cd6' d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/chat.css">
<link rel="stylesheet" href="src/workspace.css">
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--ai-surface-container-low);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Noto Sans SC", sans-serif;
  }
  #app {
    box-sizing: border-box;
    height: 100%;
    padding: 16px;
  }
  @media (max-width: 640px) {
    #app { padding: 8px; }
  }
  noscript {
    display: block;
    padding: 40px;
    text-align: center;
    color: var(--ai-text-secondary);
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript>Obsidian Arc needs JavaScript to run.</noscript>

<script src="src/store.js"></script>
<script src="src/markdown.js"></script>
<script src="src/image.js"></script>
<script src="src/provider.js"></script>
<script src="src/adapters.js"></script>
<script src="src/chat.js"></script>
<script src="src/workspace.js"></script>
<script>
  (function () {
    var lang = (navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    var storage = ObsidianAdapters.localStorageAdapter();
    ObsidianWorkspace.mount(document.getElementById('app'), {
      provider: ObsidianProvider,
      storage: storage,
      store: ObsidianStore,
      markdown: ObsidianMarkdown,
      image: ObsidianImage,
      lang: lang
    });
  })();
</script>
</body>
</html>
