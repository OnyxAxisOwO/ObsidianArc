<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Obsidian Arc</title>
<meta name="description" content="A self-hosted AI chat server.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a1a1aa' d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<!-- The same neutral the interface's own theme picker starts from
     (color-utils.ts: ACCENTS.neutral). The server rewrites the value at
     serve time to match the operator's own pwa.theme_color — see
     internal/web/branding.go — so this is only what a request for the raw
     build's own index.html, or one for an instance that never opens that
     card, actually shows. -->
<meta name="theme-color" content="#18181b">
<script>
  /* Applying the stored theme before the first paint is what prevents a
     white flash on a dark-mode reload. It has to be inline and blocking, so
     it stays a handful of lines with no imports.

     The accent decides the surface colours too, not just the buttons, so the
     flash it would otherwise cause is a whole interface changing hue. The
     palette is computed in theme.ts and cached here for exactly that reason;
     this only reads it back. */
  (function () {
    try {
      /* The scheme in force, which may be the instance's default rather
         than the reader's own (theme.ts writes it); the reader's key is
         the fallback for a browser that has not run that code yet. */
      var mode = localStorage.getItem('obsidian-arc-effective-theme')
        || localStorage.getItem('obsidian-arc-theme');
      if (mode === 'dark' || mode === 'light') {
        document.documentElement.setAttribute('data-theme', mode);
      }
      var dark = mode === 'dark'
        || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var cached = JSON.parse(localStorage.getItem('obsidian-arc-palette') || 'null');
      var css = cached && cached[dark ? 'dark' : 'light'];
      if (typeof css === 'string') document.documentElement.style.cssText = css;
    } catch (e) { /* storage disabled: fall back to the system preference */ }
  })();
</script>
</head>
<body>
<div id="app">
  <div class="oa-boot"><span class="oa-boot-spinner"></span></div>
</div>
<noscript>Obsidian Arc needs JavaScript to run.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
